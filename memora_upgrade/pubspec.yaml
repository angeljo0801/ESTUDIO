name: memora
description: Memora - turn your guides into reviews, cards, exams, and learning plans with AI.
publish_to: 'none'
version: 1.26.0+39

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.3.0
  android_file_picker: ^1.1.1
  flutter_file_dialog: ^3.3.2
  path_provider: ^2.1.5
  archive: ^4.0.9
  xml: ^7.0.1
  pdfrx: ^2.6.1
  pdf: ^3.13.0
  excel_community: ^2.4.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  llama_flutter_android: ^0.2.6
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_translation: ^0.15.1
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true