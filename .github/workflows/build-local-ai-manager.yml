name: Build Local AI Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'local_ai_manager_source.zip'
      - '.github/workflows/build-local-ai-manager.yml'

concurrency:
  group: local-ai-manager-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract source
        shell: bash
        run: |
          rm -rf /tmp/local_ai_manager_build /tmp/local_ai_manager_src /tmp/local_ai_manager_source.zip
          mkdir -p /tmp/local_ai_manager_src
          git show f0bd9d50a40054585618e150ee8b017313d407c2:local_ai_manager_source.zip > /tmp/local_ai_manager_source.zip
          unzip -q /tmp/local_ai_manager_source.zip -d /tmp/local_ai_manager_src
          SRC="/tmp/local_ai_manager_src/local_ai_manager_source"
          test -f "$SRC/pubspec.yaml"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/local_ai_manager_src/local_ai_manager_source/lib/main.dart")
          s = p.read_text()
          s = s.replace(
              "class LocalAiServer {\n  final SharedLlamaEngine engine;\n  HttpServer? _server;\n  String? lastError;",
              "class LocalAiServer {\n  final SharedLlamaEngine engine;\n  HttpServer? _server;\n  StreamSubscription<HttpRequest>? _subscription;\n  String? lastError;"
          )
          old = """  bool get running => _server != null;

  Future<void> start() async {
    if (_server != null) return;
    final port = await ManagerSettings.port();
    try {
      _server = await HttpServer.bind(InternetAddress.loopbackIPv4, port);
      _server!.listen(_handle, onError: (Object e) => lastError = e.toString());
      lastError = null;
    } catch (e) {
      lastError = e.toString();
      rethrow;
    }
  }

  Future<void> stop() async {
    await _server?.close(force: true);
    _server = null;
    await engine.unload();
  }
"""
          new = """  bool get running => _server != null;

  Future<bool> isReachable() async {
    final port = await ManagerSettings.port();
    Socket? socket;
    try {
      socket = await Socket.connect(
        InternetAddress.loopbackIPv4,
        port,
        timeout: const Duration(milliseconds: 600),
      );
      return true;
    } catch (_) {
      return false;
    } finally {
      socket?.destroy();
    }
  }

  Future<void> start() async {
    if (_server != null && await isReachable()) return;
    await _closeServerOnly();
    final port = await ManagerSettings.port();
    try {
      final server = await HttpServer.bind(InternetAddress.loopbackIPv4, port);
      _server = server;
      _subscription = server.listen(
        _handle,
        onError: (Object e) {
          lastError = e.toString();
        },
        onDone: () {
          _server = null;
          _subscription = null;
        },
        cancelOnError: false,
      );
      lastError = null;
    } catch (e) {
      _server = null;
      _subscription = null;
      lastError = e.toString();
      rethrow;
    }
  }

  Future<void> ensureAlive() async {
    if (await isReachable()) return;
    try {
      await start();
    } catch (_) {}
  }

  Future<void> _closeServerOnly() async {
    try {
      await _subscription?.cancel();
    } catch (_) {}
    _subscription = null;
    try {
      await _server?.close(force: true);
    } catch (_) {}
    _server = null;
  }

  Future<void> stop() async {
    await _closeServerOnly();
    await engine.unload();
  }
"""
          if old not in s:
              raise RuntimeError("LocalAiServer lifecycle anchor not found")
          s = s.replace(old, new, 1)
          s = s.replace(
              "if (request.method == 'GET' && (path == '/health' || path == '/status')) {",
              "if (request.method == 'GET' && (path == '/health' || path == '/status' || path == '/v1/health')) {",
              1
          )
          old = """  Future<void> _refreshStatus() async {
    if (!mounted) return;
    final status = EngineStatus(
      serverRunning: localServer.running,
"""
          new = """  Future<void> _refreshStatus() async {
    if (!mounted) return;
    await localServer.ensureAlive();
    final reachable = await localServer.isReachable();
    final status = EngineStatus(
      serverRunning: reachable,
"""
          if old not in s:
              raise RuntimeError("status refresh anchor not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          flutter create --platforms=android --org com.angelapps --project-name local_ai_manager /tmp/local_ai_manager_build
          cp "$SRC/pubspec.yaml" /tmp/local_ai_manager_build/pubspec.yaml
          rm -rf /tmp/local_ai_manager_build/lib
          cp -R "$SRC/lib" /tmp/local_ai_manager_build/lib
          rm -rf /tmp/local_ai_manager_build/test

      - name: Configure Android
        shell: bash
        working-directory: /tmp/local_ai_manager_build
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">'
          )
          permissions = '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n\n    <application'
          s = s.replace('<application', permissions, 1)
          s = s.replace(
              'android:label="local_ai_manager"',
              'android:label="Local AI Manager" android:usesCleartextTraffic="true"'
          )
          marker = '    </application>'
          service = '        <service android:name="de.julianassmann.flutter_background.IsolateHolderService" android:exported="false" android:foregroundServiceType="specialUse" tools:replace="android:foregroundServiceType">\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Keeps a local on-device AI model available to user-selected apps." />\n        </service>\n'
          if marker not in s:
              raise RuntimeError("application closing tag not found")
          s = s.replace(marker, service + marker, 1)
          p.write_text(s)
          PY

      - name: Install native toolchain
        shell: bash
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_SDK" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "cmake;3.31.0" "ndk;28.0.12674087"

      - name: Get dependencies
        working-directory: /tmp/local_ai_manager_build
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/local_ai_manager_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: /tmp/local_ai_manager_build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Local-AI-Manager-v1.0.1
          path: /tmp/local_ai_manager_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
