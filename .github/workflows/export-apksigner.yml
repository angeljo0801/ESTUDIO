name: Export Android APK Signer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-apksigner.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package apksigner
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          TOOL_DIR="$(dirname "$APKSIGNER")"
          mkdir -p /tmp/apksigner_bundle
          cp "$APKSIGNER" /tmp/apksigner_bundle/apksigner
          cp -R "$TOOL_DIR/lib" /tmp/apksigner_bundle/lib
          chmod +x /tmp/apksigner_bundle/apksigner
          echo "Bundled $APKSIGNER"
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Signer-Tool
          path: /tmp/apksigner_bundle
          retention-days: 7
