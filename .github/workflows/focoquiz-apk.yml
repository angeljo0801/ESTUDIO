name: FocoQuiz · Compilar APK Android
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'FocoQuiz/**'
      - '.github/workflows/focoquiz-apk.yml'
  push:
    branches: [main]
    paths:
      - 'FocoQuiz/source-v0.6.tar.xz.base64'
      - 'FocoQuiz/patches/**'
      - 'FocoQuiz/*.zip'
      - 'FocoQuiz/app/**'
      - 'FocoQuiz/settings.gradle.kts'
      - 'FocoQuiz/build.gradle.kts'
      - '.github/workflows/focoquiz-apk.yml'

permissions:
  contents: read

jobs:
  build-focoquiz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repositorio ESTUDIO
        uses: actions/checkout@v4

      - name: Extraer FocoQuiz v0.6 y comprobar integridad
        shell: bash
        run: |
          set -euo pipefail
          if [ -f 'FocoQuiz/source-v0.6.tar.xz.base64' ]; then
            base64 --decode 'FocoQuiz/source-v0.6.tar.xz.base64' > /tmp/focoquiz-source.tar.xz
            echo "96fb373fb4ba000a37ac09f31dc8acfdbf7cb8a2f483366c66c2bc54a1d272fc  /tmp/focoquiz-source.tar.xz" | sha256sum -c -
            tar -xJf /tmp/focoquiz-source.tar.xz -C FocoQuiz
          elif [ -f 'FocoQuiz/source-v0.6.zip' ]; then
            unzip -qo 'FocoQuiz/source-v0.6.zip' -d .
          elif [ -f 'FocoQuiz/FocoQuiz-Android-v0.6-planes-alarmas-bloqueo-global.zip' ]; then
            unzip -qo 'FocoQuiz/FocoQuiz-Android-v0.6-planes-alarmas-bloqueo-global.zip' -d .
          fi
          test -f 'FocoQuiz/settings.gradle.kts' || { echo "::error::Faltan fuentes de FocoQuiz"; exit 1; }
          test -f 'FocoQuiz/app/build.gradle.kts'

      - name: Aplicar corrección FocoQuiz v0.6.1 (plantillas e importación)
        shell: bash
        run: |
          set -euo pipefail
          python3 FocoQuiz/patches/fix_quiz_import_v061.py
          test -s FocoQuiz/app/src/main/assets/plantilla_prompt_ia.md
          test -s FocoQuiz/app/src/main/assets/ejemplo_examen.json
          grep -q 'versionName = "0.6.1"' FocoQuiz/app/build.gradle.kts

      - name: Mejorar accesibilidad y ordenar pasos de importación (v0.6.2)
        shell: bash
        run: |
          set -euo pipefail
          python3 FocoQuiz/patches/ux_quiz_steps_v062.py
          grep -q 'versionName = "0.6.2"' FocoQuiz/app/build.gradle.kts
          grep -q 'PASO 1' FocoQuiz/app/src/main/java/com/focoquiz/app/QuizSettingsActivity.kt
          grep -q 'Texto grande' FocoQuiz/app/src/main/java/com/focoquiz/app/QuizSettingsActivity.kt

      - name: Corregir colores de selectores y añadir ayuda de permisos (v0.6.3)
        shell: bash
        run: |
          set -euo pipefail
          python3 FocoQuiz/patches/dark_spinner_accessibility_v063.py
          grep -q 'versionName = "0.6.3"' FocoQuiz/app/build.gradle.kts
          grep -q 'Ayuda: permitir Accesibilidad en Samsung' FocoQuiz/app/src/main/java/com/focoquiz/app/MainActivity.kt

      - name: Evitar parpadeo del examen por ventanas de Accesibilidad (v0.6.4)
        shell: bash
        run: |
          set -euo pipefail
          python3 FocoQuiz/patches/stop_overlay_flashing_v064.py
          grep -q 'versionName = "0.6.4"' FocoQuiz/app/build.gradle.kts
          grep -q 'ForegroundWindowEvents.isOverlayWindow' FocoQuiz/app/src/main/java/com/focoquiz/app/BlockAccessibilityService.kt

      - name: Mantener navegación y teclado accesibles en el bloqueo (v0.6.5)
        shell: bash
        run: |
          set -euo pipefail
          python3 FocoQuiz/patches/keyboard_nav_safe_v065.py
          grep -q 'versionName = "0.6.5"' FocoQuiz/app/build.gradle.kts
          grep -q 'Ocultar teclado' FocoQuiz/app/src/main/java/com/focoquiz/app/BlockAccessibilityService.kt
          grep -q 'setFitInsetsTypes' FocoQuiz/app/src/main/java/com/focoquiz/app/BlockAccessibilityService.kt

      - name: Configurar firma permanente privada (v0.6.6)
        shell: bash
        run: |
          set -euo pipefail
          python3 FocoQuiz/patches/stable_private_signing_v066.py
          grep -q 'versionName = "0.6.6"' FocoQuiz/app/build.gradle.kts
          grep -q 'focoquiz_stable' FocoQuiz/app/build.gradle.kts

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK Manager en Android SDK preinstalado
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -f "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Instalar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Instalar Android API 35
        run: |
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Cargar firma privada estable (solo desde main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          FQ_KEYSTORE_BASE64: ${{ secrets.FOCOQUIZ_SIGNING_KEYSTORE_BASE64 }}
          FQ_KEYSTORE_PASSWORD: ${{ secrets.FOCOQUIZ_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Firma permanente solo permitida desde la rama main."
            exit 1
          fi
          if [ -z "$FQ_KEYSTORE_BASE64" ] || [ -z "$FQ_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configura FOCOQUIZ_SIGNING_KEYSTORE_BASE64 y FOCOQUIZ_SIGNING_PASSWORD en Settings > Secrets and variables > Actions antes de publicar."
            exit 1
          fi
          printf '%s' "$FQ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focoquiz-estable.p12"
          chmod 600 "$RUNNER_TEMP/focoquiz-estable.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/focoquiz-estable.p12" -storepass "$FQ_KEYSTORE_PASSWORD" -alias focoquiz_stable >/dev/null
          echo "::add-mask::$FQ_KEYSTORE_PASSWORD"
          echo "FOCOQUIZ_KEYSTORE_FILE=$RUNNER_TEMP/focoquiz-estable.p12" >> "$GITHUB_ENV"
          echo "FOCOQUIZ_KEYSTORE_PASSWORD=$FQ_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilar APK de validación (sin publicar)
        if: github.event_name == 'pull_request'
        working-directory: FocoQuiz
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Compilar APK release con firma permanente
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: FocoQuiz
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Publicar APK firmada para actualizaciones
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success()
        with:
          name: FocoQuiz-v0.6.6-release-APK-firma-permanente
          path: FocoQuiz/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
