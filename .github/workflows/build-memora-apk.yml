name: Build Memora APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: memora-apk-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract base project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Memora_v0.2_Flutter.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -type f -name pubspec.yaml -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Install current Memora source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf lib
          cp -R "$GITHUB_WORKSPACE/memora_upgrade/lib" ./lib
          cp "$GITHUB_WORKSPACE/memora_upgrade/pubspec.yaml" ./pubspec.yaml
      - name: Regenerate modern Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          flutter create --platforms=android --project-name memora --org com.memora --no-pub .
          rm -rf test
          sed -i 's/android:label="memora"/android:label="Memora" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/release {/a\            isMinifyEnabled = false\n            isShrinkResources = false' android/app/build.gradle.kts
          cp "$GITHUB_WORKSPACE/memora_upgrade/android/MainActivity.kt" android/app/src/main/kotlin/com/memora/memora/MainActivity.kt
          grep -A8 'release {' android/app/build.gradle.kts
      - name: Install brain launcher icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON="$GITHUB_WORKSPACE/memora_upgrade/assets/memora_brain.png"
          convert "$ICON" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Install Android native toolchain and dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "cmake;3.31.0" "ndk;28.0.12674087"
          flutter pub get
          FCLLAMA_GRADLE="$(find "$HOME/.pub-cache" -path '*/fcllama-0.0.3/android/build.gradle' -print -quit)"
          test -n "$FCLLAMA_GRADLE"
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$FCLLAMA_GRADLE"
      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Memora-v1.1-Guides-Agents-PDF-Excel-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
