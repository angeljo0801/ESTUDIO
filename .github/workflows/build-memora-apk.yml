name: Build Memora APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: memora-apk-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract base project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Memora_v0.2_Flutter.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -type f -name pubspec.yaml -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Install current Memora source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf lib
          cp -R "$GITHUB_WORKSPACE/memora_upgrade/lib" ./lib
          cp "$GITHUB_WORKSPACE/memora_upgrade/pubspec.yaml" ./pubspec.yaml
          for f in "$GITHUB_WORKSPACE"/memora_upgrade/v*.py; do cp "$f" ./; done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py');s=p.read_text()
          for marker in ('new_ask','new_run'):
              opening=marker+" = r'''";start=s.index(opening);s=s[:start]+s[start:].replace(opening,marker+' = r"""',1);end=s.index("\ns, n = re.subn(",start);segment=s[start:end];close=segment.rfind("'''");segment=segment[:close]+'"""'+segment[close+3:];s=s[:start]+segment+s[end:]
          p.write_text(s)
          PY
          python3 v14_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/agent_page.dart');s=p.read_text();broken="query: '${agent.prompt}\n$request\n${QueryAttachmentService.buildTextContext(attachments)}',";fixed="query: '${agent.prompt} $request ${QueryAttachmentService.buildTextContext(attachments)}',";p.write_text(s.replace(broken,fixed,1))
          p=Path('v15_chat_patch.py');s=p.read_text();s=s.replace("out, n = re.subn(pattern, replacement, text, count=1, flags=re.S)","out, n = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)",1);p.write_text(s)
          PY
          python3 v15_chat_patch.py
          python3 v151_library_sheet_patch.py
          python3 v16_repetition_guard_patch.py
          python3 v17_task_isolation_patch.py
          python3 v18_exam_quality_patch.py
          python3 v181_exam_storage_reset.py
          python3 v182_exam_regex_fix.py
          python3 v19_exam_pdf_export_patch.py
          python3 v110_sync_and_best_ai_patch.py
          python3 v111_exam_fragment_filter_patch.py
          python3 v112_speed_plan_export_ui_patch.py
          python3 v113_exam_timer_notifications_patch.py
          python3 v114_global_tutor_quick_ai_patch.py
          python3 v115_card_fragment_guard_patch.py
          python3 v116_semantic_card_quality_patch.py
          python3 v117_plan_local_context_patch.py
          python3 v118_english_system_patch.py
          python3 v1181_english_cleanup_patch.py
          python3 v119_translation_fast_model_patch.py
          python3 v120_learning_quality_patch.py
          python3 v121_runner.py
          python3 v122_runner.py
          python3 v123_background_execution_patch.py
          python3 v155_compile_fix_patch.py
      - name: Regenerate modern Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          flutter create --platforms=android --project-name memora --org com.memora --no-pub .
          rm -rf test
          mkdir -p test
          cp -R "$GITHUB_WORKSPACE/memora_upgrade/test/." test/
          sed -i 's/android:label="memora"/android:label="Memora" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="com.angelapps.local_ai_manager.permission.USE_AI" />\n    <queries>\n        <package android:name="com.angelapps.local_ai_manager" />\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text();marker='    </application>'
          native='''        <service android:name=".MemoraForegroundService" android:exported="false" android:stopWithTask="false" android:foregroundServiceType="dataSync" />
                  <receiver android:name=".DailyExamAlarmReceiver" android:exported="false" />
                  <receiver android:name=".DailyExamBootReceiver" android:enabled="true" android:exported="false">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
          '''
          if marker not in s: raise RuntimeError('Android application closing tag not found')
          p.write_text(s.replace(marker,native+marker,1))
          PY
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          sed -i '/release {/a\            isMinifyEnabled = false\n            isShrinkResources = false' android/app/build.gradle.kts
          cp "$GITHUB_WORKSPACE/memora_upgrade/android/MainActivity.kt" android/app/src/main/kotlin/com/memora/memora/MainActivity.kt
          cp "$GITHUB_WORKSPACE/memora_upgrade/android/LocalAiManagerBridge.kt" android/app/src/main/kotlin/com/memora/memora/LocalAiManagerBridge.kt
          cp "$GITHUB_WORKSPACE/memora_upgrade/android/MemoraForegroundService.kt" android/app/src/main/kotlin/com/memora/memora/MemoraForegroundService.kt
      - name: Install Memora icons
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON="$GITHUB_WORKSPACE/memora_upgrade/assets/memora_brain.png"
          convert "$ICON" -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON" -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON" -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/drawable-mdpi android/app/src/main/res/drawable-hdpi android/app/src/main/res/drawable-xhdpi android/app/src/main/res/drawable-xxhdpi android/app/src/main/res/drawable-xxxhdpi
          convert "$ICON" -trim +repage -resize 23x23 -gravity center -background none -extent 24x24 android/app/src/main/res/drawable-mdpi/ic_stat_memora.png
          convert "$ICON" -trim +repage -resize 34x34 -gravity center -background none -extent 36x36 android/app/src/main/res/drawable-hdpi/ic_stat_memora.png
          convert "$ICON" -trim +repage -resize 45x45 -gravity center -background none -extent 48x48 android/app/src/main/res/drawable-xhdpi/ic_stat_memora.png
          convert "$ICON" -trim +repage -resize 68x68 -gravity center -background none -extent 72x72 android/app/src/main/res/drawable-xxhdpi/ic_stat_memora.png
          convert "$ICON" -trim +repage -resize 90x90 -gravity center -background none -extent 96x96 android/app/src/main/res/drawable-xxxhdpi/ic_stat_memora.png
      - name: Install Android native toolchain and dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_SDK" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "cmake;3.31.0" "ndk;28.0.12674087"
          flutter pub get
      - name: Regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test test/pdf_extraction_regression_test.dart
      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Memora-v1.49-Editable-Library-Embeddings-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30