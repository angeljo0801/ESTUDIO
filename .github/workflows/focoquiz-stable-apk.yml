name: FocoQuiz · APK estable actualizable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar codigo del repositorio ESTUDIO
        uses: actions/checkout@v4

      - name: Extraer codigo fuente base y verificar SHA256
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode FocoQuiz/source-v0.6.tar.xz.base64 > "$RUNNER_TEMP/focoquiz-source.tar.xz"
          echo "96fb373fb4ba000a37ac09f31dc8acfdbf7cb8a2f483366c66c2bc54a1d272fc  $RUNNER_TEMP/focoquiz-source.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/focoquiz-source.tar.xz" -C FocoQuiz

      - name: Aplicar mejoras hasta FocoQuiz v0.6.5
        shell: bash
        run: |
          set -euo pipefail
          python3 FocoQuiz/patches/fix_quiz_import_v061.py
          python3 FocoQuiz/patches/ux_quiz_steps_v062.py
          python3 FocoQuiz/patches/dark_spinner_accessibility_v063.py
          python3 FocoQuiz/patches/stop_overlay_flashing_v064.py
          python3 FocoQuiz/patches/keyboard_nav_safe_v065.py
          python3 FocoQuiz/patches/permanent_release_signing.py
          grep -q 'versionName = "0.6.5"' FocoQuiz/app/build.gradle.kts
          grep -q 'create("focoquizPermanent")' FocoQuiz/app/build.gradle.kts

      - name: Cargar clave persistente de GitHub Secrets
        shell: bash
        env:
          SIGNING_B64: ${{ secrets.FOCOQUIZ_SIGNING_BUNDLE_B64 }}
          SIGNING_PASS: ${{ secrets.FOCOQUIZ_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_B64" ] || [ -z "$SIGNING_PASS" ]; then
            echo "::error::Faltan los secretos FOCOQUIZ_SIGNING_BUNDLE_B64 y/o FOCOQUIZ_SIGNING_PASSWORD. Consulta FocoQuiz/FIRMA_ESTABLE.md"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/focoquiz-signing"
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/focoquiz-signing/focoquiz.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/focoquiz-signing/focoquiz.p12" \
            -storepass "$SIGNING_PASS" -alias focoquiz >/dev/null
          echo "FOCOQUIZ_SIGNING_FILE=$RUNNER_TEMP/focoquiz-signing/focoquiz.p12" >> "$GITHUB_ENV"
          echo "Clave permanente cargada y comprobada sin exponerla en logs."

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Instalar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Instalar Android API 35
        run: |
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compilar APK release firmada con clave permanente
        working-directory: FocoQuiz
        env:
          FOCOQUIZ_SIGNING_PASSWORD: ${{ secrets.FOCOQUIZ_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verificar firma de la APK y codigo de version
        shell: bash
        run: |
          set -euo pipefail
          APK=FocoQuiz/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package:"
          sha256sum "$APK"

      - name: Publicar APK de firma persistente
        uses: actions/upload-artifact@v4
        with:
          name: FocoQuiz-v0.6.5-APK-FIRMA-ESTABLE
          path: FocoQuiz/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
